<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GKME Web Controller</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="gamepad"></canvas>

  <!-- Touchpad status label (android: 11sp, 0x99666666, centred, no chrome) -->
  <div id="topbar">
    <span id="statusText">Not connected</span>
  </div>

  <!-- Shown until the WebSocket handshake completes -->
  <div id="connectOverlay">
    <div class="card">
      <div class="logo">GKME</div>
      <div class="subtitle">Virtual web controller</div>
      <div id="connectMsg" class="msg">Connecting to host…</div>
      <button id="connectBtn" class="primary">Connect / Fullscreen</button>
      <div class="tips">
        <p>· Start GKME on the host and open its Web controller address</p>
        <p>· Use landscape orientation for the full layout</p>
        <p>· Vibration requires a mobile browser that supports the Vibration API</p>
      </div>
    </div>
  </div>

  <!-- Settings overlay -->
  <div id="settings" class="hidden">
    <aside id="settingsNav">
      <button id="settingsClose" class="sideback">
        <svg class="sideback-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="#CCCCCC" d="M20,11H7.8l5.6,-5.6L12,4l-8,8 8,8 1.4,-1.4L7.8,13H20v-2z" />
        </svg>
        <span>Back</span>
      </button>
      <div class="sidebar-divider"></div>
      <div id="settingsNavList"></div>
    </aside>
    <main id="settingsMain">
      <header class="settingsheader">
        <span class="settingsTitle">GKME Settings</span>
      </header>
      <div id="settingsBody"></div>
    </main>
  </div>

  <!-- Layout editor floating panel (FloatingEditorPanel) -->
  <div id="editpanel" class="hidden">
    <div id="editHeader">
      <div id="editGrip" aria-label="Drag panel">
        <span></span><span></span><span></span>
      </div>
      <button id="editCollapse" type="button" aria-label="Collapse/expand panel"></button>
    </div>
    <div id="editScroll">
      <div id="editActions"></div>
      <div id="editSep"></div>
      <div id="editParams"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
